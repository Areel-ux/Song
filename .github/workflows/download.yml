name: Download Spotify
on: [push]
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install spotdl
      run: pip install spotdl
    - name: Download playlist
      run: spotdl "https://open.spotify.com/playlist/2d27XbqeTU6ePJVokdgg57?si=kuxQ_-c2RX2TtwenI0_1aA&pi=lYw3cnTJS3Gvw"
    - uses: actions/upload-artifact@v4
      with:
        name: music
        path: "*.mp3"
